# Canonical names are stable machine-readable columns. aliases are labels used
# by CBR workbooks; the parser matches them case-insensitively and by fragments.
# form is the individual CBR reporting form. Group form 0409805 is deliberately absent.
identifiers:
  - {name: regn_gko, label: REGN_GKO, type: identifier}
  - {name: bank_name, label: Название банка, type: identifier}
  - {name: year, label: year, type: identifier}

